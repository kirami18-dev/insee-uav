<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon/favicon-192.png"/>
<link rel="apple-touch-icon" sizes="192x192" href="/images/favicon/favicon-192.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coming Soon | INSEE UAV</title>
<meta name="description" content="หน้านี้กำลังอยู่ระหว่างการพัฒนา — INSEE UAV"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          'brand-blue': '#0084C8',
          'brand-navy': '#0A1628',
          'primary-container': '#3d9be9',
          'on-surface-variant': '#c0c7d3',
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', 'Kanit', system-ui, sans-serif; background:#0A1628; color:#d7e3fc; }
  .clip-path-angled { clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 100%, 0 100%); }
  .grid-overlay { background-image: radial-gradient(circle, rgba(64, 71, 81, 0.15) 1px, transparent 1px); background-size: 24px 24px; }

    /* === GLOBAL MOBILE RESPONSIVE === */
    @media (max-width: 768px) {
      html, body { overflow-x: hidden !important; }
      /* Hero titles in payload/work pages */
      .hero-title { font-size: 32px !important; line-height: 1.1 !important; }
      .hero-product { font-size: 32px !important; line-height: 1.1 !important; }
      .hero-pretitle { font-size: 11px !important; letter-spacing: 2px !important; }
      .hero-tagline { font-size: 16px !important; }
      .hero-desc { font-size: 13px !important; line-height: 1.6 !important; }
      .hero-content { padding: 24px !important; }
      .hero-badges { gap: 6px !important; }
      .badge { padding: 4px 10px !important; font-size: 10px !important; }
      /* Card grids — 1 col on mobile */
      .card-features, .features-grid, .specs-grid, .work-image-grid, .quick-stats { grid-template-columns: 1fr !important; }
      .card-hero, .card-specs, .card-laser, .card-mission, .card-package, .card-cta { padding: 24px !important; border-radius: 16px !important; }
      .specs-header h2 { font-size: 22px !important; }
      .card-label { font-size: 14px !important; }
      /* Tables — horizontal scroll */
      .mission-table, .flight-table { font-size: 11px !important; }
      table { font-size: 12px !important; }
      div[style*="overflow-x"] { -webkit-overflow-scrolling: touch; }
      /* Buttons — wrap properly */
      .btn, .btn-primary, .btn-outline { padding: 12px 18px !important; font-size: 12px !important; }
      .cta-buttons { flex-direction: column !important; gap: 12px !important; }
      .cta-buttons .btn { width: 100% !important; text-align: center !important; justify-content: center !important; }
      /* Page content */
      .page-content { padding: 24px 16px !important; }
      /* Hide elements that don't fit */
      .hero-tech, .hero-footer { font-size: 11px !important; }
      /* Spec grids */
      .spec-value { font-size: 20px !important; }
      .spec-label { font-size: 10px !important; }
      .phys-val { font-size: 20px !important; }
      /* INSEE-350 / INSEE-250 hero titles */
      h1.hero-title, .platform-hero h1 { font-size: 36px !important; }
      /* Generic 2-col grids → 1 col */
      div[style*="grid-template-columns: 1fr 1fr"], 
      div[style*="grid-template-columns: 1fr 1.2fr"],
      div[style*="grid-template-columns: 1fr 1.5fr"],
      div[style*="grid-template-columns: 2fr 1fr"],
      div[style*="grid-template-columns: 1.2fr 1fr"] { 
        grid-template-columns: 1fr !important; 
      }
      /* Configurator 3-col → stack */
      div[style*="grid-template-columns: repeat(3, 1fr)"] { 
        grid-template-columns: repeat(2, 1fr) !important; 
      }
      /* Section labels */
      .section-label { margin-top: 32px !important; margin-bottom: 12px !important; }
      /* Reduce padding inside cards */
      div[style*="padding: 48px"] { padding: 24px !important; }
      div[style*="padding: 56px"] { padding: 24px !important; }
      div[style*="padding: 40px"] { padding: 20px !important; }
      /* Hero strip/banner */
      .hero-banner { height: 280px !important; }
      .hero-banner .hero-title { font-size: 24px !important; }
      .hero-meta { gap: 12px !important; font-size: 11px !important; }
      /* Mega-menu hide on mobile (use hamburger later) */
      .mega-menu-content, .nav-dropdown-content { display: none !important; }
      /* Carousel arrows smaller */
      .sc-arrow { width: 36px !important; height: 36px !important; }
      .sc-arrow .material-symbols-outlined { font-size: 20px !important; }
      .sc-thumb { flex: 0 0 60px !important; height: 45px !important; }
      /* Filter button on works */
      .filter-btn { padding: 7px 14px !important; font-size: 11px !important; }
      /* Image grids */
      .ref-gallery { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
      /* CTA card */
      .card-cta h2 { font-size: 22px !important; }
      .cta-content { padding: 0 !important; }
      .cta-logos { flex-wrap: wrap !important; gap: 12px !important; }
      .cta-logo-text { font-size: 16px !important; }
    }

</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Simple header -->
<header class="w-full bg-[#0A1628]/80 backdrop-blur-xl border-b border-white/10 py-4">
  <div class="max-w-[1440px] mx-auto px-8">
    <a href="/" class="flex items-center">
      <img alt="INSEE UAV" class="h-8" src="/images/logo-insee.png"/>
    </a>
  </div>
</header>

<!-- Coming Soon Content -->
<main class="flex-1 flex items-center justify-center grid-overlay px-8 py-24">
  <div class="max-w-2xl text-center">
    <span class="material-symbols-outlined text-7xl text-primary-container mb-6">construction</span>
    <p class="text-primary-container font-bold text-xs mb-3 tracking-[0.3em] uppercase">// In Development</p>
    <h1 class="text-5xl md:text-6xl font-bold text-white uppercase tracking-tighter mb-6">Coming Soon</h1>
    <p class="text-lg text-on-surface-variant font-light leading-relaxed mb-2">
      หน้านี้กำลังอยู่ระหว่างการพัฒนา
    </p>
    <p class="text-base text-on-surface-variant/70 font-light mb-10">
      We're working on this page. Please check back soon.
    </p>
    <div class="flex flex-wrap gap-4 justify-center">
      <a href="/" class="bg-primary-container text-[#0A1628] px-8 py-4 font-bold uppercase text-sm clip-path-angled hover:brightness-110 transition-all">
        ← Back to Home
      </a>
      <a href="/#contact" class="border border-primary-container text-primary-container px-8 py-4 font-bold uppercase text-sm clip-path-angled hover:bg-primary-container/10 transition-all">
        Contact Us
      </a>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-[#071120] border-t border-white/10 py-6">
  <div class="max-w-[1440px] mx-auto px-8 text-center">
    <p class="text-[10px] text-on-surface-variant/40 uppercase tracking-widest">© 2026 INSEE UAV CO., LTD. — Operated by Thai Sky Vision Co., Ltd.</p>
  </div>
</footer>

</body>
</html>
